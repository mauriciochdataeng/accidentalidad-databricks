[project]
name = "accidentalidad-databricks"
version = "0.1.0"
requires-python = ">=3.10"
# Mantener esta lista alineada con requirements-databricks.txt (cluster clásico/local).
dependencies = [
    "databricks-sdk>=0.40,<1",
    "mlflow>=2.13,<4",
    "scikit-learn>=1.3,<2",
    "pandas>=1.5,<3",
    "numpy>=1.23,<3",
    "scipy>=1.10,<2",
    "cloudpickle>=2.2,<4",
]

[tool.databricks.environment]
environment_version = "5"

[tool.uv]
package = false
